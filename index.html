<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="assets/styles.css">
  <title>Lunar Faire Tickets</title>
</head>

<body>
  <main class="flex flex-col flex-center">
    <img src="assets/images/lunar-faire-logo.png" alt="Lunar Faire Logo" id="logo">
    <!-- Form starts -->
    <form action="" method="post" class="form" id="ticket-form">
      <h1 class="title">Your Journey to <span class="fancy">Lunar Faire</span> Starts Here!</h1>

      <p class="text-center neutral-300">Secure your spot at the next witchy & weird night market!</p>
      <!-- Upload photo -->
      <div class="upload-container">
        <p id="upload-label" class="form-label">Upload Avatar</p>
        <!-- DRAG AND DROP ZONE -->
        <div id="drop-zone" class="flex flex-center" role="region" aria-labelledby="upload-label">
          <label for="avatar" class="drop-zone-content flex flex-col flex-center">
            <div class="upload-icon" aria-hidden="true">
              <img src="assets/images/icon-upload.svg" alt="upload icon" class="drop-zone-icon">
              <div class="preview flex flex-col flex-center">
                <div id="avatar-preview" aria-live="polite"></div>
                <!-- Buttons (hidden by default, only show up after image is uploaded) -->
                <div class="hidden preview-buttons">
                  <div class="flex space-between gap-1">
                    <!-- Remove image -->
                    <button id="remove-img-btn">Remove image</button>
                    <!-- Change image -->
                    <button id="change-img-btn">Change image</button>
                  </div>
                </div>
              </div>
            </div>

            <span class="drop-text neutral-300">Drag and drop or click to upload</span>

            <input type="file" id="avatar" name="avatar" multiple accept="image/*" class="visually-hidden">

          </label>
        </div>

        <p class="info-text neutral-300">
          <img src="assets/images/icon-info.svg" role="presentation" />
          Upload your photo (JPG or PNG, max size: 500KB).
        </p>
      </div>
      <!-- Full Name -->
      <div>
        <label for="full-name" class="form-label">
          Full Name
        </label>
        <input type="text" name="full-name" id="full-name" required />
      </div>
      <!-- Email Address -->
      <div>
        <label for="email" class="form-label">
          Email Address
        </label>
        <input type="email" name="email" id="email" placeholder="example@email.com" required />
      </div>
      <!-- GitHub -->
      <div>
        <label for="github" class="form-label">
          GitHub Username
        </label>
        <input type="text" name="github" id="github" placeholder="@yourusername" required />
      </div>
      <!-- Submit -->
      <div>
        <input type="submit" class="button" value="Generate My Ticket" />
      </div>
    </form>
    <!-- Form ends -->

    <!-- Generated ticket-->

    <!-- <p>We've emailed your ticket to <span class="email">Email Address</span> and will send updates in the run up to the
      event.</p> -->

  </main>
  <script src="assets/script.js"></script>
</body>

</html>
